.orz{width:180px;color:var(--rd);animation:drop .9s ease-out both}
.cheer{width:110px;color:var(--ac);animation:bn .7s ease-in-out infinite alternate}
.orzt{font-size:44px;font-weight:800;letter-spacing:4px;animation:drop 1s .25s ease-out both}
.cloud{font-size:44px;animation:fl 3s ease-in-out infinite alternate}
.cf{position:fixed;top:-24px;width:8px;height:14px;animation:fall linear infinite;z-index:10;pointer-events:none}
.fw{position:fixed;width:10px;height:10px;border:3px solid currentColor;border-radius:50%;opacity:0;animation:bst 2s ease-out infinite;z-index:10;pointer-events:none}
.rain{position:fixed;inset:0;pointer-events:none;opacity:.45;background:repeating-linear-gradient(105deg,transparent 0 16px,#9fb8e0 16px 17px);background-size:44px 130px;animation:rn .45s linear infinite}
@keyframes drop{0%{transform:translateY(-140px);opacity:0}65%{transform:translateY(10px);opacity:1}82%{transform:translateY(-5px)}100%{transform:none;opacity:1}}
@keyframes bn{to{transform:translateY(-14px)}}
@keyframes fl{to{transform:translateX(18px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bst{0%{transform:scale(0);opacity:1}100%{transform:scale(14);opacity:0}}

.ft{padding-top:0}.ftc{display:flex;gap:14px;align-items:center}.lgb{width:64px;height:64px;flex:none;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}.lgb img{max-width:100%;max-height:100%;object-fit:contain}.lgb svg{width:100%;height:100%;display:none}.lgb.nolg img{display:none}.lgb.nolg svg{display:block}

<script>
const f=n=>(n<0?'−':'')+'NT$'+Math.abs(Math.round(n)).toLocaleString('zh-TW');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PROS={
 teacher:{n:'國小老師',lv:'簡單',sal:48000,tax:5000,live:18000,home:12000,cash:200000,debts:[]},
 eng:{n:'軟體工程師',lv:'普通',sal:75000,tax:11000,live:25000,home:20000,cash:250000,debts:[]},
 doc:{n:'住院醫師',lv:'困難：高薪也高支出',sal:110000,tax:20000,live:30000,home:25000,cash:100000,debts:[{n:'助學貸款',bal:1500000,pay:12000}]}
};
let S=null;
const passive=()=>S.assets.reduce((a,x)=>a+x.inc,0);
const salNow=()=>S.jobless>0?0:S.sal;
const expenses=()=>S.tax+S.live+S.home+S.kids*8000+(S.car?CARFEE:0)+S.debts.reduce((a,x)=>a+x.pay,0);
const income=()=>salNow()+passive();
const cf=()=>income()-expenses();

const IC={'ETF 定期定額加碼':'📈','高股息 ETF':'💵','線上課程／數位商品':'💻','部落格廣告與聯盟行銷':'📝','老屋小套房出租':'🏠','早餐店加盟':'🏪','市區店面出租':'🏬','蛋黃區新成屋（投資用）':'🏢','朋友推薦：保證年報酬 50%':'⚠️','新款手機':'📱','歐洲旅遊':'✈️','換新車':'🚗','家電升級':'📺','名牌包':'👜','年終獎金':'🧧','車輛維修':'🔧','住院醫療':'🏥','結婚':'💍','迎接新生兒':'👶','公司裁員':'📦','升職加薪':'⬆️','央行升息':'🏦','進修課程':'📚'};
const dic=d=>d.n==='助學貸款'?'🎓':d.n.startsWith('信貸')?'🧾':d.n.endsWith('貸款')?'🏦':'💳';
/* 卡牌：每張為工廠函式，抽到時才產生 */
const buy=(n,cost,down,pay,inc,tip)=>()=>({k:'投資機會',n,
 desc:`總價 ${f(cost)}｜頭期款 ${f(down)}｜每月收入 +${f(inc)}${pay?`｜貸款月付 −${f(pay)}`:''}｜淨現金流 ${f(inc-pay)}`,tip,
 acts:[{l:`買下（付 ${f(down)}）`,ok:()=>S.cash>=down,f:()=>{S.cash-=down;S.assets.push({n,inc,cost});if(cost>down)S.debts.push({n:n+'貸款',bal:cost-down,pay});return `買入「${n}」，被動收入 +${f(inc)}`}},{l:'放棄',f:()=>'放棄這次機會'}]});
/* 音效：Web Audio 合成，無外部音檔 */
const AU={x:null,on:(()=>{try{return localStorage.getItem('cf-snd')!=='0'}catch(e){return true}})()};
function ax(){if(!AU.x){try{AU.x=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AU.x.state==='suspended')AU.x.resume();return AU.x}
function tn(f,t,d,o={}){const c=ax();if(!c)return;const s=c.currentTime+t,g=c.createGain(),n=c.createOscillator(),v=o.v||.18;n.type=o.ty||'sine';n.frequency.setValueAtTime(f,s);if(o.to)n.frequency.exponentialRampToValueAtTime(o.to,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);if(o.lp){const l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=o.lp;n.connect(l);l.connect(g)}else n.connect(g);if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*.04;l.connect(lg);lg.connect(n.frequency);l.start(s);l.stop(s+d)}g.connect(c.destination);n.start(s);n.stop(s+d+.02)}
function nz(t,d,v,lp){const c=ax();if(!c)return;const s=c.currentTime+t,b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const r=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();r.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);r.connect(f);f.connect(g);g.connect(c.destination);r.start(s)}
const SFX={
 start:()=>[523,659,784,1047].forEach((f,i)=>tn(f,i*.12,.25,{ty:'triangle'})),
 pay:()=>{tn(988,0,.1,{ty:'square',v:.07});tn(1319,.09,.3,{ty:'square',v:.07})},
 buy:()=>[523,659,784].forEach((f,i)=>tn(f,i*.07,.16,{ty:'triangle'})),
 house:()=>{tn(900,0,.38,{to:180,v:.1});tn(80,.38,.25,{to:35,v:.5});nz(.38,.18,.5,500);tn(70,.62,.15,{to:35,v:.25});nz(.62,.1,.2,400)},
 spend:()=>{tn(520,0,.12,{ty:'triangle'});tn(390,.1,.2,{ty:'triangle'})},
 skip:()=>tn(440,0,.08,{v:.08}),
 good:()=>[659,784,988,1319].forEach((f,i)=>tn(f,i*.08,.18,{ty:'triangle'})),
 bad:()=>{tn(220,0,.25,{ty:'sawtooth',to:150,v:.1,lp:900});tn(165,.22,.35,{ty:'sawtooth',to:110,v:.1,lp:900})},
 baby:()=>[0,.6].forEach(t=>tn(560,t,.5,{ty:'sawtooth',to:430,v:.12,lp:2200,vib:7})),
 win:()=>{[523,659,784].forEach((f,i)=>tn(f,i*.12,.2,{ty:'triangle'}));tn(1047,.4,.6,{ty:'triangle'});[784,988,1175,1568].forEach((f,i)=>tn(f,1+i*.14,.22,{ty:'triangle'}));[1047,1319,1568].forEach(f=>tn(f,1.7,1.5,{ty:'triangle',v:.1}));[2093,2637,3136,2637,3136,4186].forEach((f,i)=>tn(f,2.3+i*.12,.25,{v:.05}));for(let i=0;i<5;i++)nz(i*.08,.07,.15,3000)},
 lose:()=>{[[392,370,0],[349,330,.85],[311,294,1.7]].forEach(([a,b,t])=>tn(a,t,.8,{ty:'sawtooth',to:b,v:.1,lp:800,vib:5}));tn(262,2.6,1.8,{ty:'sawtooth',to:165,v:.12,lp:700,vib:4});nz(0,1.4,.08,500);[3.7,4.1].forEach(t=>tn(60,t,.25,{to:38,v:.45}))}
};
const sfx=k=>{if(AU.on&&SFX[k]){try{SFX[k]()}catch(e){}}};
function toggleSnd(){AU.on=!AU.on;try{localStorage.setItem('cf-snd',AU.on?'1':'0')}catch(e){}if(AU.on)sfx('buy');render()}
const PROP=['老屋小套房出租','市區店面出租','蛋黃區新成屋（投資用）'],GOOD=['年終獎金','升職加薪','進修課程','結婚'];
function sk(c,a){if(['放棄','拒絕','不買','不報名'].includes(a.l))return 'skip';if(c.k==='投資機會')return c.n.startsWith('朋友')?'bad':PROP.includes(c.n)?'house':'buy';if(c.k==='消費誘惑')return 'spend';return c.n==='迎接新生兒'?'baby':GOOD.includes(c.n)?'good':'bad'}
const AM={'ETF 定期定額加碼':['有價證券','張'],'高股息 ETF':['有價證券','張'],'線上課程／數位商品':['數位事業','項'],'部落格廣告與聯盟行銷':['數位事業','個'],'老屋小套房出租':['不動產','間'],'早餐店加盟':['實體事業','間'],'市區店面出租':['不動產','間'],'蛋黃區新成屋（投資用）':['不動產','棟']},CR=['不動產','有價證券','實體事業','數位事業','資產'];
function grp(){const m={};S.assets.forEach(a=>{const t=AM[a.n]||['資產','項'],g=m[a.n]||(m[a.n]={n:a.n,k:0,inc:0,c:t[0],u:t[1]});g.k++;g.inc+=a.inc});return Object.values(m).sort((a,b)=>CR.indexOf(a.c)-CR.indexOf(b.c))}
const rate=d=>d.r!=null?d.r:d.n.endsWith('分期')?0:d.n==='助學貸款'?.015:d.n.endsWith('貸款')?.025:.08;
function amort(){const dn=[];S.debts=S.debts.filter(d=>{const i=d.bal*rate(d)/12,p=Math.max(0,d.pay-i);if(d.bal<=p+1){dn.push(d.n);return false}d.bal=Math.round(d.bal-p);return true});return dn}
const CARFEE=5000;
const own=n=>n==='換新車'?(S.car=1,`，之後每月另有養車費 ${f(CARFEE)}`):'';
const sp=(n,amt,mo=24)=>()=>({k:'消費誘惑',n,desc:`標價 ${f(amt)}｜分期月付 −${f(amt/mo)}（${mo} 期）${n==='換新車'?`｜養車費（油、保險、稅、保養）−${f(CARFEE)}/月`:''}`,
 ok:()=>n!=='換新車'||!S.car,tip:'消費品不會產生收入，分期還會增加每月支出，把你推離財富自由。',
 acts:[{l:'付現',ok:()=>S.cash>=amt,f:()=>{S.cash-=amt;return `付現 ${f(amt)} 買了「${n}」${own(n)}`}},
 {l:'分期',f:()=>{S.debts.push({n:n+'分期',bal:amt,pay:Math.round(amt/mo)});return `分期買了「${n}」，每月多支出 ${f(amt/mo)}${own(n)}`}},{l:'不買',f:()=>`忍住了，省下 ${f(amt)}`}]});
const ev=(n,desc,tip,fn,ok)=>()=>({k:'人生事件',n,desc,tip,ok,acts:[{l:'確認',f:fn}]});
const B=[
 buy('ETF 定期定額加碼',50000,50000,0,350,'分散投資、長期持有，是最容易入門的被動收入。'),
 buy('高股息 ETF',100000,100000,0,700,'股息是被動收入，但價格會波動：注意風險。'),
 buy('線上課程／數位商品',80000,80000,0,3000,'做一次、長期銷售，是事業型被動收入。'),
 buy('部落格廣告與聯盟行銷',30000,30000,0,1500,'內容資產需要時間累積，成本低但要有耐心。'),
 buy('老屋小套房出租',3000000,600000,10800,13000,'槓桿放大收益，也放大風險；看「淨現金流」而非總價。'),
 buy('早餐店加盟',600000,300000,3000,12000,'事業需要經營，不是完全被動，注意投入的時間成本。'),
 buy('市區店面出租',12000000,3000000,40000,55000,'大機會需要大頭期款：先累積現金與被動收入。'),
 buy('蛋黃區新成屋（投資用）',9000000,1800000,32000,18000,'月付高於租金，淨現金流為負：它更像負債，不是資產。'),
 ()=>({k:'投資機會',n:'朋友推薦：保證年報酬 50%',desc:'投入 100,000，對方說每月固定回 +4,000，保證不賠。',tip:'「保證高報酬」是詐騙警訊：報酬與風險永遠成正比。',
  acts:[{l:'投入 100,000',ok:()=>S.cash>=100000,f:()=>{S.cash-=100000;return '被騙了，本金全失。'}},{l:'拒絕',f:()=>'明智拒絕了詐騙。'}]})
];
const Sp=[sp('新款手機',35000),sp('歐洲旅遊',80000),sp('換新車',800000,60),sp('家電升級',25000),sp('名牌包',60000)];
const E=[
 ev('年終獎金','公司發放年終獎金 +45,000。','工作收入是起點，但要把獎金拿去買資產。',()=>{S.cash+=45000;return '現金 +45,000'}),
 ev('車輛維修','汽車大修 −20,000。','緊急預備金（3–6 個月支出）能避免被迫舉債。',()=>{S.cash-=20000;return '現金 −20,000'},()=>S.car),
 ev('住院醫療','突發住院 −30,000。','保險與預備金是財務防線。',()=>{S.cash-=30000;return '現金 −30,000'}),
 ev('結婚','舉辦婚禮與蜜月，一次性支出 −300,000。','婚禮是一次性大額支出：先編預算、備好現金，別用分期或信貸辦喜事。',()=>{S.cash-=300000;S.married=true;return '現金 −300,000'},()=>!S.married),
 ev('迎接新生兒','家裡添丁，每月支出 +8,000。','人生階段會改變支出，要把被動收入目標一併調高。',()=>{S.kids++;return '每月支出 +8,000'},()=>S.kids<2),
 ev('公司裁員','失業 2 個月，沒有薪水。','只靠薪水最脆弱；被動收入就是你的安全網。',()=>{S.jobless=2;return '接下來 2 個月沒有薪水'},()=>S.jobless===0),
 ev('升職加薪','月薪 +3,000。','加薪後別提高生活水準，把差額投入資產。',()=>{S.sal+=3000;return '月薪 +3,000'}),
 ev('央行升息','貸款利率上調，所有貸款月付 +10%。','槓桿有風險：利率上升會吃掉現金流。',()=>{S.debts.forEach(d=>{d.pay=Math.round(d.pay*1.1);if(!d.n.endsWith('分期'))d.r=rate(d)+.01});return '貸款月付提高 10%，利率上升 1%'},()=>S.debts.length>0),
 ()=>({k:'人生事件',n:'進修課程',desc:'報名專業進修 −20,000，完成後月薪 +2,500。',tip:'投資自己是報酬率最高的投資之一。',
  acts:[{l:'報名',ok:()=>S.cash>=20000,f:()=>{S.cash-=20000;S.sal+=2500;return '現金 −20,000，月薪 +2,500'}},{l:'不報名',f:()=>'維持現狀'}]})
];
function draw(){for(let i=0;i<30;i++){const r=Math.random();const c=pick(r<.42?B:r<.65?Sp:E)();if(!c.ok||c.ok())return c}return pick(B)()}

function fixCash(){if(S.cash<0){const a=Math.ceil(-S.cash/10000)*10000;S.cash+=a;S.debts.push({n:'信貸（被迫舉債）',bal:a,pay:Math.round(a*.015)});S.res={msg:`現金不足，被迫信貸 ${f(a)}，月付 ${f(a*.015)}`,tip:'沒有預備金時，意外會變成高利負債。'}}}
function endCheck(){if(S.over)return;const p=passive(),e=expenses();
 if(p>0&&p>=e)S.over='win';else if(cf()<0&&S.cash<-cf()*2)S.over='lose'}
function save(){try{localStorage.setItem('cf-v1',JSON.stringify({...S,card:null,res:null}))}catch(e){}}
function start(k){const p=PROS[k];S={p:k,month:1,cash:p.cash,sal:p.sal,tax:p.tax,live:p.live,home:p.home,kids:0,jobless:0,assets:[],debts:p.debts.map(d=>({...d})),card:null,res:null,over:null,prev:p.cash};S.card=draw();sfx('start');render()}
function act(i){const c=S.card,a=c.acts[i];if(a.ok&&!a.ok())return;const msg=a.f();S.res={msg,tip:c.tip};S.card=null;fixCash();endCheck();sfx(S.over||sk(c,a));render()}
function next(){const c=cf();S.prev=S.cash;S.cash+=c;if(S.jobless>0)S.jobless--;S.month++;fixCash();const dn=amort();S.res={msg:`領薪結算：本月現金流 ${f(c)}`+(dn.length?`；已還清：${dn.join('、')}`:''),tip:dn.length?'負債還清後，每月支出下降，現金流直接變好。':''};S.card=draw();endCheck();sfx(S.over||(dn.length?'good':'pay'));render()}
function borrow(){S.cash+=100000;S.debts.push({n:'信貸',bal:100000,pay:1500});render()}
function payoff(i){const d=S.debts[i];if(S.cash<d.bal)return;S.cash-=d.bal;S.debts.splice(i,1);render()}
function cashbar(){const a=S.prev==null?S.cash:S.prev,b=S.cash,d=b-a,mx=Math.max(a,b,1),up=d>=0;
const row=(l,v,c)=>`<div class="r" style="border:0;align-items:center"><span style="width:60px">${l}</span><div class="bar" style="flex:1;margin:2px 0"><i style="width:${v/mx*100}%;background:${c}"></i></div><b style="width:108px;text-align:right">${f(v)}</b></div>`;
return row('上月底',a,'var(--mu)')+row('目前',b,up?'var(--gn)':'var(--rd)')+`<div class="${up?'pos':'neg'}"><b>${d===0?'本月現金持平':(up?'▲ 本月現金增加 ':'▼ 本月現金減少 ')+f(Math.abs(d))}</b></div>`}
const SVG_L='<svg class="fg orz" viewBox="0 0 150 95" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="64" r="10"/><path d="M46 62Q70 50 98 50"/><path d="M60 53L52 85"/><path d="M98 50L100 85H132"/><path d="M8 88H142" stroke-width="3" opacity=".4"/></svg>',
SVG_W='<svg class="fg cheer" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="28" r="11"/><path d="M44 30Q50 36 56 30" stroke-width="3"/><path d="M50 40V70M50 48L24 22M50 48L76 22M50 70L36 94M50 70L64 94"/></svg>';
function endScreen(p,e,c){const w=S.over==='win',r=(a,b)=>a+Math.random()*(b-a),cl=['#f5c542','#4fc08d','#ff6b5e','#5aa9ff','#c77dff'];let fx='';
if(w){for(let i=0;i<46;i++)fx+=`<i class="cf" style="left:${r(0,100)}%;background:${cl[i%5]};animation-duration:${r(2.5,5)}s;animation-delay:${r(0,3)}s"></i>`;for(let i=0;i<8;i++)fx+=`<span class="cf" style="left:${r(0,100)}%;width:auto;height:auto;font-size:22px;animation-duration:${r(3,5)}s;animation-delay:${r(0,3)}s">🪙</span>`;for(let i=0;i<4;i++)fx+=`<b class="fw" style="left:${r(10,90)}%;top:${r(8,40)}%;color:${cl[i%5]};animation-delay:${i*.5}s"></b>`}else fx='<div class="rain"></div>';
const row=(l,v,k)=>`<div class="r"><span>${l}</span><b class="${k||''}">${v}</b></div>`,pct=e?Math.round(p/e*100):0;
if(w)return `<div class="m win">${fx}<div class="c" style="text-align:center">${SVG_W}<h1>🎉 財富自由！</h1><p>你的被動收入已經養得起你的生活。</p>${row('用了',S.month+' 個月')}${row('被動收入 ÷ 總支出',pct+'%','pos')}${row('每月被動收入',f(p),'pos')}${row('持有資產',S.assets.length+' 件')}${row('現金',f(S.cash))}<h3>這局的觀念</h3><p class="mu">資產＝每月替你帶來現金的東西；負債＝每月從你口袋拿走現金的東西。財富自由不是存到多少錢，而是被動收入覆蓋支出。</p><button class="p" onclick="reset()">再玩一次</button></div></div>`;
const it=[['稅金',S.tax],['生活開銷',S.live],['房租／房貸',S.home],['子女',S.kids*8000],['養車費',S.car?CARFEE:0],['負債月付',S.debts.reduce((a,x)=>a+x.pay,0)]].sort((a,b)=>b[1]-a[1])[0];
return `<div class="m lose">${fx}<div class="c" style="text-align:center"><div class="cloud">🌧️</div>${SVG_L}<h1>財務破產</h1><p>現金撐不過兩個月，每月現金流為 ${f(c)}。</p>${row('撐了',S.month+' 個月')}${row('被動收入 ÷ 總支出',pct+'%')}${row('最大支出項目',it[0]+' '+f(it[1])+'/月','neg')}<h3>這局的教訓</h3><p class="mu">${it[0]==='負債月付'?'負債月付是最大壓力：借錢與分期前，先算清楚每月現金流撐不撐得住。':'先建立緊急預備金，避免被動負債堆高；買資產前，先算淨現金流。'}</p><button class="p" onclick="reset()">再玩一次</button></div></div>`}
let rc=false,rt;
function askReset(){if(rc){rc=false;clearTimeout(rt);reset();return}rc=true;render();rt=setTimeout(()=>{rc=false;if(S)render()},4000)}
function reset(){try{localStorage.removeItem('cf-v1')}catch(e){}S=null;render()}
const cl=n=>n>=0?'pos':'neg';
function render(){
 const A=document.getElementById('app');document.getElementById('brand').style.display=S?'none':'';
 if(!S){let h='<h1>財富自由之路：現金流模擬器</h1><div class="c"><p><b>目標：被動收入 ≥ 每月總支出。</b>薪水是用時間換錢；被動收入是資產替你賺錢。每個月抽一張卡，決定買資產、還是買負債。</p><p class="mu">金額為台灣情境的簡化模擬，僅供學習，不構成投資建議。</p><h3>選擇職業</h3>';
  for(const k in PROS){const p=PROS[k];h+=`<button class="p" onclick="start('${k}')">${p.n}（月薪 ${f(p.sal)}）</button><span class="mu">${p.lv}</span><br>`}
  try{if(localStorage.getItem('cf-v1'))h+='<br><button onclick="load()">繼續上次進度</button>'}catch(e){}
  A.innerHTML=h+'</div>';return}
 save();
 const p=passive(),e=expenses(),pct=Math.min(100,p/e*100),c=cf();
 let h=`<div class="top"><h1>第 ${S.month} 個月｜${PROS[S.p].n}</h1><span><button onclick="toggleSnd()" title="音效開關">${AU.on?'🔊':'🔇'}</button><button onclick="askReset()"${rc?' class="p"':''}>${rc?'再按一次，確認重新開始':'重新開始'}</button></span></div>
 <div class="c"><div class="top"><b>財富自由進度</b><b>${pct.toFixed(1)}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="mu">被動收入 ${f(p)} ÷ 總支出 ${f(e)}｜現金 <b class="${cl(S.cash)}">${f(S.cash)}</b>｜月現金流 <b class="${cl(c)}">${f(c)}</b></div></div><div class="c" style="margin-top:12px"><b>現金總量（本月變化）</b>${cashbar()}</div><div class="g" style="margin-top:12px"><div>`;
 if(S.card){const k=S.card;h+=`<div class="c"><span class="tag">${k.k}</span><h3 style="margin:0;color:var(--tx);font-size:17px"><span style="font-size:30px;vertical-align:middle">${IC[k.n]||''}</span> ${k.n}</h3><p>${k.desc}</p>`;
  k.acts.forEach((a,i)=>h+=`<button class="p" ${a.ok&&!a.ok()?'disabled':''} onclick="act(${i})">${a.l}</button>`);h+='</div>'}
 else h+=`<div class="c"><p>本月決策完成。</p><button class="p" onclick="next()">領薪，進入下個月 ▶</button></div>`;
 if(S.res)h+=`<div class="res">${S.res.msg}${S.res.tip?`<div class="mu">💡 ${S.res.tip}</div>`:''}</div>`;
 h+=`<div class="c" style="margin-top:12px"><b>資產</b>${S.assets.length?grp().map(g=>`<div class="r"><span>${IC[g.n]||''} （${g.c}）${g.n} ${g.k}${g.u}</span><b class="pos">+${f(g.inc)}/月</b></div>`).join(''):'<div class="mu">尚無資產，去抓住第一個機會</div>'}</div></div><div>
 <div class="c"><b>收入表</b><div class="r"><span>薪資${S.jobless?'（失業中）':''}</span><b>${f(salNow())}</b></div><div class="r"><span>被動收入</span><b class="pos">${f(p)}</b></div><div class="r"><span>總收入</span><b>${f(income())}</b></div></div>
 <div class="c" style="margin-top:12px"><b>支出表</b><div class="r"><span>稅金</span><b>${f(S.tax)}</b></div><div class="r"><span>生活開銷</span><b>${f(S.live)}</b></div><div class="r"><span>房租／房貸</span><b>${f(S.home)}</b></div>${S.kids?`<div class="r"><span>子女（${S.kids} 位）</span><b>${f(S.kids*8000)}</b></div>`:''}${S.car?`<div class="r"><span>🚗 養車費用（油、保險、稅、保養）</span><b>${f(CARFEE)}</b></div>`:''}<div class="r"><span>負債月付</span><b>${f(S.debts.reduce((a,x)=>a+x.pay,0))}</b></div><div class="r"><span>總支出</span><b>${f(e)}</b></div></div>
 <div class="c" style="margin-top:12px"><b>負債</b>${S.debts.length?S.debts.map((d,i)=>`<div class="r"><span>${dic(d)} ${d.n}<span class="mu">（餘 ${f(d.bal)}）</span></span><span class="neg">−${f(d.pay)}/月 <button style="padding:2px 8px;margin:0 0 0 6px" ${S.cash<d.bal?'disabled':''} onclick="payoff(${i})">還清</button></span></div>`).join(''):'<div class="mu">無</div>'}<button onclick="borrow()">借 100,000（月付 −1,500）</button></div></div></div>`;
 if(S.over)h+=endScreen(p,e,c);
 A.innerHTML=h}
function load(){try{S=JSON.parse(localStorage.getItem('cf-v1'));S.card=draw();render()}catch(e){reset()}}
render();
</script></body></html>
