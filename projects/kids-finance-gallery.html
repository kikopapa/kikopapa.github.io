                description: "手機刷卡嗶一聲好輕鬆，但背後其實正把存錢筒裡真正的金幣流出去，更要看緊小錢包！",
                keyPoints: ["數位支付", "真實金錢"]
            },
            {
                id: 2,
                title: "被動收入 V.S 主動收入",
                category: "現金流觀念篇",
                imageUrl: IMAGE_BASE_PATH + "finance-02-passive-vs-active.webp",
                description: "用「灌溉金錢果樹」對比「埋頭苦幹加班」：讓孩子理解主動收入是有上班才有薪水，而被動收入則是前期付出努力栽種與維護，就能帶來每個月穩定的現金流。",
                keyPoints: ["種植金錢樹", "穩定現金流", "工作與資產的差別"]
            },
            {
                id: 1,
                title: "認識金錢的三個好朋友",
                category: "基礎分配篇",
                imageUrl: IMAGE_BASE_PATH + "finance-01-three-jars.webp",
                description: "透過三個透明玻璃罐「1.儲蓄 (存錢長大)、2.消費 (分辨需要與想要)、3.投資 (讓錢慢慢變多)」，陪伴孩子建立最健康的金錢分配習慣。",
                keyPoints: ["1. 儲蓄 Saving", "2. 消費 Spending", "3. 投資 Investing"]
            },
            {
                id: 7,
                title: "「需要」還是「想要」？",
                category: "基礎分配篇",
                imageUrl: IMAGE_BASE_PATH + "finance-07-need-or-want.webp",
                description: "生活需要的（不買會影響生活）vs 心裡想要的（不買也完全沒事）；買東西前停三秒：先買需要，再看想要！",
                keyPoints: ["生活需要", "心裡想要", "停三秒思考"]
            },
            {
                id: 3,
                title: "財富自由 (被動收入 ＞ 生活開銷)",
                category: "財務目標篇",
                imageUrl: IMAGE_BASE_PATH + "finance-03-financial-freedom.webp",
                description: "運用直觀的天平蹺蹺板，當左邊「被動收入（金錢樹產出的果實）」的重量大於右邊「日常開銷（飲食、生活用品與帳單）」時，就能讓錢替我們工作，達成財富自由！",
                keyPoints: ["被動收入 > 生活開銷", "天平視覺化", "讓錢替你工作"]
            }
        ];

        // ============================================================================
        // 互動畫廊核心狀態與控制邏輯
        // ============================================================================
        let currentIndex = 0;
        let currentViewMode = 'slide'; // 'slide' | 'grid'
        let lbZoom = 1;

        // 觸控與滑鼠拖曳狀態
        let isDragging = false;
        let startX = 0;
        let dragMovedDistance = 0;

        // DOM 元素參照
        const track = document.getElementById('carouselTrack');
        const viewport = document.getElementById('carouselViewport');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const gridCardsWrapper = document.getElementById('gridCardsWrapper');

        /**
         * 智慧圖片容錯處理：若找不到 .webp，自動依序嘗試 .jpg -> .png -> .jpeg
         * 若全部找不到，直接在畫面上顯示缺少的檔案名稱
         */
        function handleImgError(imgEl) {
            const currentSrc = imgEl.getAttribute('src') || '';
            const tried = parseInt(imgEl.dataset.retry || '0', 10);
            const baseWithoutExt = currentSrc.replace(/\.(webp|jpg|jpeg|png)$/i, '');

            if (tried === 0) {
                imgEl.dataset.retry = '1';
                imgEl.src = baseWithoutExt + '.jpg';
            } else if (tried === 1) {
                imgEl.dataset.retry = '2';
                imgEl.src = baseWithoutExt + '.png';
            } else if (tried === 2) {
                imgEl.dataset.retry = '3';
                imgEl.src = baseWithoutExt + '.jpeg';
            } else {
                imgEl.onerror = null;
                const missingFile = baseWithoutExt.split('/').pop();
                imgEl.src = 'https://placehold.co/800x600/FAF6F0/3A5A40?text=' + encodeURIComponent('找不到圖檔: ' + missingFile);
            }
        }

        /**
         * 初始化畫廊（渲染所有輪播圖卡、縮圖與網格）
         */
        function renderAllViews() {
            // 1. 渲染輪播軌道
            track.innerHTML = LESSONS_DATA.map((item, idx) => `
                <div class="w-full h-full shrink-0 flex items-center justify-center p-2 sm:p-4 select-none" ondblclick="openLightbox(${idx})">
                    <img src="${item.imageUrl}"
                         alt="${item.title}"
                         draggable="false"
                         onclick="handleImageClick(event, ${idx})"
                         onerror="handleImgError(this)"
                         class="w-full h-full object-contain rounded-xl shadow-sm cursor-pointer transition-transform duration-300 hover:scale-[1.01]" />
                </div>
            `).join('');

            // 2. 渲染底部縮圖導覽列
            thumbnailContainer.innerHTML = LESSONS_DATA.map((item, idx) => `
                <button onclick="goToSlide(${idx})"
                        id="thumb-${idx}"
                        class="group relative flex items-center gap-2.5 p-2 rounded-2xl border-2 transition-all shrink-0 text-left w-56 sm:w-64 ${idx === currentIndex ? 'bg-forest text-white border-forest shadow-md scale-[1.02]' : 'bg-white hover:bg-forest-pale/60 text-forest-dark border-wood-light/60'}">
                    <img src="${item.imageUrl}" alt="${item.title}" onerror="handleImgError(this)" class="w-16 h-12 object-cover rounded-lg border border-black/10 shrink-0 bg-paper" />
                    <div class="overflow-hidden">
                        <span class="text-[11px] font-bold uppercase tracking-wider block ${idx === currentIndex ? 'text-accent-gold' : 'text-wood'}">
                            STEP 0${idx + 1}
                        </span>
                        <p class="text-xs sm:text-sm font-black truncate">${item.title.replace(/^\d+\.\s*/, '')}</p>
                    </div>
                </button>
            `).join('');

            // 3. 渲染圓點進度指示器
            dotsIndicator.innerHTML = LESSONS_DATA.map((_, idx) => `
                <button onclick="goToSlide(${idx})"
                        aria-label="跳至第 ${idx + 1} 張"
                        class="h-2.5 rounded-full transition-all ${idx === currentIndex ? 'w-7 bg-forest' : 'w-2.5 bg-wood-light hover:bg-wood'}"></button>
            `).join('');

            // 4. 渲染網格全覽模式卡片
            document.getElementById('totalCountBadge').textContent = `共 ${LESSONS_DATA.length} 張`;
            gridCardsWrapper.innerHTML = LESSONS_DATA.map((item, idx) => `
                <article onclick="openLightbox(${idx})" class="group bg-white rounded-3xl p-3.5 border-2 border-forest/20 hover:border-forest shadow-card hover:shadow-notebook transition-all cursor-pointer flex flex-col justify-between">
                    <div>
                        <div class="relative overflow-hidden rounded-2xl aspect-[4/3] bg-paper border border-wood-light/40 mb-3">
                            <img src="${item.imageUrl}" alt="${item.title}" onerror="handleImgError(this)" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" />
                            <span class="absolute top-2.5 left-2.5 px-2.5 py-0.5 bg-forest/90 text-white text-xs font-bold rounded-full backdrop-blur-sm">
                                單元 ${idx + 1}
                            </span>
                            <div class="absolute inset-0 bg-forest-dark/0 group-hover:bg-forest-dark/20 transition-colors flex items-center justify-center">
                                <span class="opacity-0 group-hover:opacity-100 transition-opacity bg-white text-forest-dark font-bold text-xs px-3 py-1.5 rounded-xl shadow-md flex items-center gap-1">
                                    🔍 點擊放大檢視
                                </span>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-wood px-2 py-0.5 bg-wood-light/25 rounded-md">${item.category}</span>
                        <h3 class="text-lg font-black text-forest-dark mt-1.5 group-hover:text-forest transition-colors">${item.title}</h3>
                        <p class="text-xs sm:text-sm text-gray-600 mt-1 line-clamp-2 leading-relaxed">${item.description}</p>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-3 pt-2.5 border-t border-dashed border-wood-light/50">
                        ${item.keyPoints.map(tag => `<span class="text-[11px] font-bold px-2 py-0.5 bg-forest-pale text-forest rounded-md">#${tag}</span>`).join('')}
                    </div>
                </article>
            `).join('');

            // 更新目前投影片資訊
            updateSlideInfo();
        }

        /**
         * 更新目前顯示的圖卡文字與狀態
         */
        function updateSlideInfo() {
            const currentItem = LESSONS_DATA[currentIndex];
            if (!currentItem) return;

            // 位移輪播軌道
            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            // 更新文字資訊
            document.getElementById('currentBadge').textContent = `單元 ${currentIndex + 1} / ${LESSONS_DATA.length}`;
            document.getElementById('currentCategory').textContent = currentItem.category;
            document.getElementById('currentTitle').textContent = currentItem.title;
            document.getElementById('currentDesc').textContent = currentItem.description;

            // 更新重點標籤
            document.getElementById('currentKeyPoints').innerHTML = currentItem.keyPoints.map(tag => `
                <span class="px-3 py-1 bg-forest-pale text-forest font-bold text-xs sm:text-sm rounded-xl border border-forest/20 flex items-center gap-1">
                    <span class="text-forest-light">🌱</span> ${tag}
                </span>
            `).join('');

            // 更新縮圖高亮狀態
            LESSONS_DATA.forEach((_, idx) => {
                const thumb = document.getElementById(`thumb-${idx}`);
                if (!thumb) return;
                if (idx === currentIndex) {
                    thumb.className = "group relative flex items-center gap-2.5 p-2 rounded-2xl border-2 transition-all shrink-0 text-left w-56 sm:w-64 bg-forest text-white border-forest shadow-md scale-[1.02]";
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    thumb.className = "group relative flex items-center gap-2.5 p-2 rounded-2xl border-2 transition-all shrink-0 text-left w-56 sm:w-64 bg-white hover:bg-forest-pale/60 text-forest-dark border-wood-light/60";
                }
            });

            // 更新圓點指示器
            Array.from(dotsIndicator.children).forEach((dot, idx) => {
                dot.className = `h-2.5 rounded-full transition-all ${idx === currentIndex ? 'w-7 bg-forest' : 'w-2.5 bg-wood-light hover:bg-wood'}`;
            });
        }

        function goToSlide(index) {
            if (index < 0) {
                currentIndex = LESSONS_DATA.length - 1;
            } else if (index >= LESSONS_DATA.length) {
                currentIndex = 0;
            } else {
                currentIndex = index;
            }
            updateSlideInfo();
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        // ============================================================================
        // 手機觸控滑動 (Touch Swipe) 與 滑鼠拖曳 (Mouse Drag) 支援
        // ============================================================================
        function startDrag(clientX) {
            isDragging = true;
            startX = clientX;
            dragMovedDistance = 0;
            track.classList.add('dragging');
        }

        function moveDrag(clientX) {
            if (!isDragging) return;
            const diff = clientX - startX;
            dragMovedDistance = Math.abs(diff);
            const viewportWidth = viewport.offsetWidth;
            const percentShift = (diff / viewportWidth) * 100;
            track.style.transform = `translateX(${-currentIndex * 100 + percentShift}%)`;
        }

        function endDrag(clientX) {
            if (!isDragging) return;
            isDragging = false;
            track.classList.remove('dragging');
            const diff = clientX - startX;
            const threshold = viewport.offsetWidth * 0.15;

            if (diff < -threshold) {
                nextSlide();
            } else if (diff > threshold) {
                prevSlide();
            } else {
                updateSlideInfo();
            }
        }

        function handleImageClick(event, idx) {
            if (dragMovedDistance < 10) {
                openLightbox(idx);
            }
        }

        viewport.addEventListener('touchstart', e => startDrag(e.touches[0].clientX), { passive: true });
        viewport.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX), { passive: true });
        viewport.addEventListener('touchend', e => endDrag(e.changedTouches[0].clientX));

        viewport.addEventListener('mousedown', e => {
            if (e.target.closest('button')) return;
            startDrag(e.clientX);
        });
        window.addEventListener('mousemove', e => moveDrag(e.clientX));
        window.addEventListener('mouseup', e => endDrag(e.clientX));

        // ============================================================================
        // 全螢幕燈箱 (Lightbox) 控制邏輯
        // ============================================================================
        const lightboxModal = document.getElementById('lightboxModal');
        const lbImage = document.getElementById('lbImage');
        const lbImgWrapper = document.getElementById('lbImgWrapper');

        function openLightbox(index) {
            currentIndex = index;
            updateSlideInfo();
            updateLightboxContent();
            resetZoomLightbox();
            lightboxModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function updateLightboxContent() {
            const item = LESSONS_DATA[currentIndex];
            lbImage.dataset.retry = '0';
            lbImage.onerror = function() { handleImgError(this); };
            lbImage.src = item.imageUrl;
            document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${LESSONS_DATA.length}`;
            document.getElementById('lbTitle').textContent = item.title;
            document.getElementById('lbDesc').textContent = item.description;
            document.getElementById('lbTags').innerHTML = item.keyPoints.map(tag => `
                <span class="px-2.5 py-0.5 bg-forest text-white text-xs font-bold rounded-full">#${tag}</span>
            `).join('');
        }

        function lbPrev(e) {
            if (e) e.stopPropagation();
            prevSlide();
            resetZoomLightbox();
            updateLightboxContent();
        }

        function lbNext(e) {
            if (e) e.stopPropagation();
            nextSlide();
            resetZoomLightbox();
            updateLightboxContent();
        }

        function zoomLightbox(delta) {
            lbZoom = Math.min(2.5, Math.max(0.5, lbZoom + delta));
            lbImgWrapper.style.transform = `scale(${lbZoom})`;
            document.getElementById('lbZoomLevel').textContent = `${Math.round(lbZoom * 100)}%`;
        }

        function resetZoomLightbox() {
            lbZoom = 1;
            lbImgWrapper.style.transform = 'scale(1)';
            document.getElementById('lbZoomLevel').textContent = '100%';
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'lbStage' || e.target.id === 'lbImgWrapper') {
                closeLightbox();
            }
        }

        window.addEventListener('keydown', e => {
            if (!lightboxModal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') lbPrev();
                if (e.key === 'ArrowRight') lbNext();
            } else if (currentViewMode === 'slide') {
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'ArrowRight') nextSlide();
            }
        });

        // ============================================================================
        // 檢視模式切換 (輪播 vs 網格)
        // ============================================================================
        function switchViewMode(mode) {
            currentViewMode = mode;
            const slideContainer = document.getElementById('slideViewContainer');
            const gridContainer = document.getElementById('gridViewContainer');
            const btnSlide = document.getElementById('btnSlideView');
            const btnGrid = document.getElementById('btnGridView');

            if (mode === 'slide') {
                slideContainer.classList.remove('hidden');
                gridContainer.classList.add('hidden');
                btnSlide.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-forest text-white shadow-sm transition-all";
                btnGrid.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-forest-dark hover:bg-white/60 transition-all";
            } else {
                slideContainer.classList.add('hidden');
                gridContainer.classList.remove('hidden');
                btnGrid.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-forest text-white shadow-sm transition-all";
                btnSlide.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-forest-dark hover:bg-white/60 transition-all";
            }
        }

        // 啟動畫廊
        renderAllViews();
    </script>
</body>
</html>
