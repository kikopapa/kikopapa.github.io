function start(k){const c=CH[k];S={c:k,wk:1,cash:c.cash,prev:c.cash,assets:[],debts:[],back:[],zero:[],star:0,gift:0,card:null,res:null,over:null};S.card=draw();sfx('start');render()}
function load(){try{S=JSON.parse(localStorage.getItem('kmt-v1'));S.back=S.back||[];S.zero=S.zero||[];S.card=draw();render()}catch(e){reset()}}
function act(i){const c=S.card,a=c.acts[i];if(a.ok&&!a.ok())return;const m=a.f(),d=fixCash();S.res={msg:m+(d?'；'+d:''),tip:d?TIPB:c.tip};S.card=null;endCheck();sfx(S.over||a.s||c.s);render()}
function next(){const z=cf(true),p=passive(true);S.prev=S.cash;S.cash+=z;S.zero=[];const full=[];S.assets.forEach(a=>{a.age++;if(a.age===AD[a.k][4])full.push(AD[a.k][0])});const dn=amort();S.wk++;
 let m=`第 ${S.wk-1} 週結算：${z>=0?'+':''}${f(z)}`;if(full.length)m+=`；🎉 ${full.join('、')} 長大了！`;if(dn)m+='；還清一筆欠款';
 S.back=S.back.filter(b=>{if(b.wk>S.wk)return true;if(Math.random()<.5){S.cash+=b.v;m+=`；朋友還你 ${f(b.v)}`}else m+='；朋友沒有還錢…';return false});
 const d=fixCash();S.res={msg:m+(d?'；'+d:''),tip:d?TIPB:(full.length?'長大後每週都有收入，這就是「讓錢幫你工作」。':'')};S.card=draw();endCheck();sfx(S.over||(full.length?'good':p>0?'egg':'pay'));render()}
function payoff(i){const d=S.debts[i];if(S.cash<d.bal)return;S.cash-=d.bal;S.debts.splice(i,1);render()}
function cashbar(){const a=S.prev,b=S.cash,d=b-a,mx=Math.max(a,b,1),up=d>=0;const row=(l,v,c)=>`<div class="r" style="border:0;align-items:center"><span style="width:60px">${l}</span><div class="bar" style="flex:1;margin:2px 0"><i style="width:${v/mx*100}%;background:${c}"></i></div><b style="width:96px;text-align:right">${f(v)}</b></div>`;
 return row('上週底',a,'var(--mu)')+row('現在',b,up?'var(--gn)':'var(--rd)')+`<div class="${up?'pos':'neg'}"><b>${d===0?'本週現金持平':(up?'▲ 本週現金增加 ':'▼ 本週現金減少 ')+f(Math.abs(d))}</b></div>`}
function grp(){const m={};S.assets.forEach(a=>{const g=m[a.k]||(m[a.k]={k:a.k,t:0,m:0,left:0});g.t++;if(mat(a))g.m++;else g.left=Math.max(g.left,AD[a.k][4]-a.age)});return Object.values(m)}
function endScreen(p){const w=S.over==='win',r=(a,b)=>a+Math.random()*(b-a),cl=['#f5c542','#4fc08d','#ff6b5e','#5aa9ff','#c77dff'];let fx='';
 if(w){for(let i=0;i<46;i++)fx+=`<i class="cf" style="left:${r(0,100)}%;background:${cl[i%5]};animation-duration:${r(2.5,5)}s;animation-delay:${r(0,3)}s"></i>`;for(let i=0;i<8;i++)fx+=`<span class="cf" style="left:${r(0,100)}%;width:auto;height:auto;font-size:22px;animation-duration:${r(3,5)}s;animation-delay:${r(0,3)}s">🥚</span>`;for(let i=0;i<4;i++)fx+=`<b class="fw" style="left:${r(10,90)}%;top:${r(8,40)}%;color:${cl[i%5]};animation-delay:${i*.5}s"></b>`}else fx='<div class="rain"></div>';
 const row=(l,v,k)=>`<div class="r"><span>${l}</span><b class="${k||''}">${v}</b></div>`;
 if(w)return `<div class="m win">${fx}<div class="c" style="text-align:center">${SVG_W}<h1>🎉 你種出了錢果樹！</h1><p>果子和金蛋的收入，已經比每週花費還多，不用打工也夠花了！</p>${row('用了',S.wk+' 週')}${row('每週果子＋金蛋收入',f(p),'pos')}${row('養大的樹和鵝',S.assets.filter(mat).length+' 個')}${row('愛心星星','⭐ '+S.star)}<h3>這局的觀念</h3><p class="mu">資產像會結果的樹、會下金蛋的鵝，要先花時間養大；等牠們長大，錢就會自己跑進你的口袋。</p><button class="p" onclick="reset()">再玩一次</button></div></div>`;
 return `<div class="m lose">${fx}<div class="c" style="text-align:center"><div class="cloud">🌧️</div>${SVG_L}<h1>破產了…</h1><p>欠爸媽的錢太多，爸媽不能再借你了。借錢要多還利息，先存一點備用金會更划算。</p>${row('撐了',S.wk+' 週')}${row('欠爸媽',f(dbal()),'neg')}${row('果子＋金蛋收入',f(passive()))}<h3>這局的教訓</h3><p class="mu">先存一些備用金，再慢慢養樹養鵝；不要把錢都花在「想要」的東西上。失敗也是學習，再種一次吧！</p><button class="p" onclick="reset()">再玩一次</button></div></div>`}
let rc=false,rt;
function askReset(){if(rc){rc=false;clearTimeout(rt);reset();return}rc=true;render();rt=setTimeout(()=>{rc=false;if(S)render()},4000)}
function reset(){try{localStorage.removeItem('kmt-v1')}catch(e){}S=null;render()}
function render(){const A=document.getElementById('app');document.getElementById('brand').style.display=S?'none':'';
 if(!S){let h='<h1>🌳 小樹成長記：種出我的錢果樹</h1><div class="c"><p><b>目標：</b>讓「果子和金蛋」每週的收入，比你每週的基本花費還多，這樣你不用打工也夠花！</p><p>樹和鵝都要<b>慢慢養大</b>，越早種越早收成。</p><p>現金不夠時，可以向爸媽借錢，但要付<b>利息（借錢費）</b>：借 100 元，要多還 10 元。欠太多，爸媽就不借你了。</p><p class="mu">金額為簡化設定，僅供學習，不是投資建議。</p><h3>選一位角色</h3>';
  for(const k in CH){const c=CH[k];h+=`<button class="p" onclick="start('${k}')">${c.e} ${c.n}（每週零用錢 ${f(c.al)}）</button><span class="mu">${c.lv}</span><br>`}
  try{if(localStorage.getItem('kmt-v1'))h+='<br><button onclick="load()">繼續上次進度</button>'}catch(e){}
  A.innerHTML=h+'</div>';return}
 save();const p=passive(),pc=Math.min(100,p/FIX*100),c=cf(true),ch=CH[S.c];
 let h=`<div class="top"><h1>第 ${S.wk} 週｜${ch.e} ${ch.n}</h1><span><button onclick="toggleSnd()" title="音效開關">${AU.on?'🔊':'🔇'}</button><button onclick="askReset()"${rc?' class="p"':''}>${rc?'再按一次，確認重新開始':'重新開始'}</button></span></div>
 <div class="c"><div class="top"><b>不用打工也夠花　進度</b><b>${pc.toFixed(0)}%</b></div><div class="bar"><i style="width:${pc}%"></i></div><div class="mu">果子＋金蛋收入 ${f(p)} ÷ 每週基本花費 ${f(FIX)}｜現金 <b class="${cc(S.cash)}">${f(S.cash)}</b></div></div>
 <div class="c" style="margin-top:12px"><b>我的現金（本週變化）</b>${cashbar()}</div><div class="g" style="margin-top:12px"><div>`;
 if(S.card){const k=S.card;h+=`<div class="c"><span class="tag">${k.k}</span><h3 style="margin:0;color:var(--tx);font-size:17px"><span style="font-size:30px;vertical-align:middle">${k.ic}</span> ${k.n}</h3><p>${k.desc}</p>`;k.acts.forEach((a,i)=>h+=`<button class="p" ${a.ok&&!a.ok()?'disabled':''} onclick="act(${i})">${a.l}</button>`);h+='</div>'}
 else h+='<div class="c"><p>這週的決定完成了。</p><button class="p" onclick="next()">領零用錢，進入下一週 ▶</button></div>';
 if(S.res)h+=`<div class="res">${S.res.msg}${S.res.tip?`<div class="mu">💡 ${S.res.tip}</div>`:''}</div>`;
 h+=`<div class="c" style="margin-top:12px"><b>我的果樹和金蛋鵝</b>${S.assets.length?grp().map(g=>{const d=AD[g.k],t=tree(g.k),i1=t?'🌳':'🪿',i0=t?'🌱':'🐣';return `<div class="r"><span>${g.m?i1:i0} ${d[0]} ${g.t}${d[2]}</span><b class="pos">+${f(g.m*d[5])}/週</b></div>`+(g.t>g.m?`<div class="mu">${i0} 成長中 ${g.t-g.m}${d[2]}，還要 ${g.left} 週</div>`:'')}).join(''):'<div class="mu">還沒有，去種下第一棵樹或養第一隻鵝吧</div>'}</div></div><div>
 <div class="c"><b>我的錢包</b><div class="r"><span>每週零用錢</span><b>${f(ch.al)}</b></div><div class="r"><span>每週基本花費</span><b>${f(FIX)}</b></div><div class="r"><span>果子＋金蛋收入</span><b class="pos">${f(p)}</b></div><div class="r"><span>還錢給爸媽（每週）</span><b>${f(dpay())}</b></div><div class="r"><span>每週剩下</span><b class="${cc(c)}">${f(c)}</b></div><div class="r"><span>愛心星星</span><b>⭐ ${S.star}</b></div></div>
 <div class="c" style="margin-top:12px"><b>欠爸媽的錢</b>${S.debts.length?S.debts.map((d,i)=>`<div class="r"><span>💸 還欠 ${f(d.bal)}<span class="mu">，每週還 ${f(d.pay)}</span></span><button style="padding:2px 8px;margin:0" ${S.cash<d.bal?'disabled':''} onclick="payoff(${i})">還清</button></div>`).join(''):'<div class="mu">沒有欠款</div>'}<div class="mu">💡 什麼是利息（借錢費）？借 100 元，要多還 10 元。欠爸媽超過 ${f(DMAX)}，爸媽就不借你了，你會破產喔。</div></div></div></div>`;
 if(S.over)h+=endScreen(p);A.innerHTML=h}
render();
</script></body></html>
