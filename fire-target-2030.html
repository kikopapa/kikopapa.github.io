<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2030 願景畫布</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --accent-color: #f1c40f; 
            --sub-color: #8b949e;
            --progress-bg: #21262d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* 核心大目標 */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .highlight {
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 30px rgba(241, 196, 15, 0.2);
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* 進度條區塊 */
        .progress-section {
            margin: 30px 0;
            text-align: left;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: var(--progress-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            width: 0; /* 由 JS 控制長度 */
            border-radius: 6px;
            transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1); /* 平滑滑入動畫 */
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        /* 月份倒數 */
        .countdown {
            font-size: 1.3rem;
            color: var(--sub-color);
            margin-top: 50px;
            border-top: 1px solid #21262d;
            padding-top: 25px;
            letter-spacing: 1px;
        }

        .time-num {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.8rem;
            margin: 0 4px;
        }

        /* 關於筆者簽名檔設定（深色主題適配版） */
        .author-box {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-left: 5px solid var(--accent-color);
            border-radius: 12px;
            padding: 25px;
            margin-top: 45px;
            text-align: left;
            line-height: 1.75;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .author-title {
            margin: 0 0 12px 0;
            font-size: 1.25rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-content p {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            color: #c9d1d9;
        }

        .author-content p:last-child {
            margin-bottom: 0;
        }

        .author-content strong {
            color: var(--text-color);
        }

        .author-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .author-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.4rem; }
            .countdown { font-size: 1.1rem; }
            .author-box { padding: 20px; }
            .author-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 核心目標 -->
        <h1>我在 2030 年</h1>
        <div class="subtitle">
            累積淨資產達 <span class="highlight">5000 萬</span>
            年被動收入達 <span class="highlight">200 萬</span><br>
            累積網誌文章達 <span class="highlight">150 篇</span>
        </div>

        <!-- 微型進度條區塊 -->
        <div class="progress-section">
            <div class="progress-label">
                <span>淨資產進度</span>
                <span id="asset-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="asset-bar"></div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-label">
                <span>年被動收入進度</span>
                <span id="income-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="income-bar"></div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-label">
                <span>網誌進度</span>
                <span id="weblog-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="weblog-bar"></div>
            </div>
        </div>

        <!-- 月份倒數 -->
        <div class="countdown" id="timer">
            距離目標實現，大約還剩 <span class="time-num" id="months-left">00</span> 個月份
        </div>

        <!-- 關於筆者簽名檔開始 -->
        <div class="author-box">
            <div class="author-content">
                <h3 class="author-title">✍️ 關於筆者</h3>
                <p>我是<strong>小樹爸爸（ KIKOPAPA ）</strong>，<a href="https://www.kikopapa.com" class="author-link">KIKO Journey</a> 的創作者。我的經歷涵蓋產品開發、軟硬體整合、專案管理與圍棋教學，也持續關注理財、科技、個人成長及 AI 應用。</p>
                <p>如果想進一步了解我的人生歷程，歡迎閱讀 👉 <a href="https://www.kikopapa.com/p/about-me.html" class="author-link">我的故事：從科技業走向第二人生</a></p>
            </div>
        </div>
        <!-- 關於筆者簽名檔結束 -->
    </div>

    <script>
        const currentAsset = 3000;
        const targetAsset = 5000;

        const currentIncome = 110;
        const targetIncome = 200;

        const currentWeblog = 68;
        const targetWeblog = 150;

        const assetPercent = Math.min(Math.round((currentAsset / targetAsset) * 100), 100);
        const incomePercent = Math.min(Math.round((currentIncome / targetIncome) * 100), 100);
        const weblogPercent = Math.min(Math.round((currentWeblog / targetWeblog) * 100), 100);
        
        setTimeout(() => {
            document.getElementById('asset-bar').style.width = assetPercent + '%';
            document.getElementById('asset-percent').innerText = assetPercent + '%';

            document.getElementById('income-bar').style.width = incomePercent + '%';
            document.getElementById('income-percent').innerText = incomePercent + '%';

            document.getElementById('weblog-bar').style.width = weblogPercent + '%';
            document.getElementById('weblog-percent').innerText = weblogPercent + '%';
        }, 300);

        function calculateMonthsLeft() {
            const now = new Date();
            const targetDate = new Date('January 1, 2030 00:00:00');
            
            let months = (targetDate.getFullYear() - now.getFullYear()) * 12;
            months += targetDate.getMonth() - now.getMonth();
            
            if (months <= 0) {
                document.getElementById('timer').innerHTML = "願景實現的時間已到！";
            } else {
                document.getElementById('months-left').innerText = months;
            }
        }

        calculateMonthsLeft();
    </script>
</body>
</html>
